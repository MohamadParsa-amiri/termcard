[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termcard"
version = "1.0.0"
description = "Spaced-repetition flashcards in your terminal, with first-class RTL (Persian) support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamad Parsa Amiri" }]
keywords = [
    "flashcards", "spaced-repetition", "sm-2", "anki", "terminal",
    "cli", "tui", "persian", "farsi", "rtl", "language-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
termcard = "termcard.__main__:main"

[project.urls]
Homepage = "https://github.com/MohamadParsa-amiri/termcard"
Issues = "https://github.com/MohamadParsa-amiri/termcard/issues"

[tool.setuptools.packages.find]
include = ["termcard*"]

[tool.setuptools.package-data]
termcard = ["data/*.json"]
